<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignAI Web - AI Powered</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { position: relative; display: inline-block; margin-top: 20px; border: 4px solid #4CAF50; border-radius: 10px; overflow: hidden; }
        video { display: none; }
        canvas { transform: scaleX(-1); background-color: black; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        #final-word { align-self: center; background: rgba(0, 255, 0, 0.8); color: black; padding: 15px 40px; font-size: 36px; font-weight: bold; border-radius: 10px; text-transform: uppercase; display: none; margin-bottom: 20px; text-shadow: 1px 1px 2px rgba(255,255,255,0.5); }
        #voice-indicator { position: absolute; top: 10px; right: 10px; background: rgba(33, 150, 243, 0.8); padding: 5px 10px; border-radius: 5px; font-size: 14px; font-weight: bold; }
        #status-box { position: absolute; top: 10px; left: 10px; background: rgba(255, 152, 0, 0.8); padding: 5px 10px; border-radius: 5px; font-size: 14px; font-weight: bold; color: black;}
        /* ΝΕΟ: Ζωντανό Ραντάρ Οθόνης */
        #live-radar { position: absolute; bottom: 10px; left: 10px; background: rgba(0, 0, 0, 0.7); padding: 10px; border-radius: 8px; font-size: 18px; color: #00FF00; font-family: monospace; text-align: left;}
        h1 { margin-top: 0; color: #4CAF50; }
    </style>
</head>
<body>

    <h1>🚀 SignAI: Τεχνητή Νοημοσύνη</h1>
    <p>Δείξε μια χειρονομία στην κάμερα. Πάτα <b>1</b> για Άντρα ή <b>2</b> για Γυναίκα.</p>

    <div class="container">
        <video id="video_element" width="640" height="480" autoplay></video>
        <canvas id="canvas_element" width="640" height="480"></canvas>
        <div id="ui-layer">
            <div id="status-box">Φόρτωση AI...</div>
            <div id="voice-indicator">Φωνή: Γυναίκα (Προεπιλογή)</div>
            <div id="final-word"></div>
            <div id="live-radar">Ραντάρ: Αναμονή...</div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('video_element');
        const canvasElement = document.getElementById('canvas_element');
        const canvasCtx = canvasElement.getContext('2d');
        const finalWordBox = document.getElementById('final-word');
        const voiceIndicator = document.getElementById('voice-indicator');
        const statusBox = document.getElementById('status-box');
        const liveRadar = document.getElementById('live-radar'); // Το νέο ραντάρ

        let preferredGender = 'female'; 
        window.addEventListener('keydown', (e) => {
            if (e.key === '1') {
                preferredGender = 'male';
                voiceIndicator.innerText = "Φωνή: Άντρας";
            } else if (e.key === '2') {
                preferredGender = 'female';
                voiceIndicator.innerText = "Φωνή: Γυναίκα";
            }
        });

        function speakGreek(text) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'el-GR';
            utterance.rate = 1.0;
            let voices = window.speechSynthesis.getVoices().filter(v => v.lang.includes('el'));
            if (voices.length > 0) {
                let selectedVoice = voices[0]; 
                for (let v of voices) {
                    let name = v.name.toLowerCase();
                    if (preferredGender === 'male' && (name.includes('stefanos') || name.includes('male'))) { selectedVoice = v; break; }
                    else if (preferredGender === 'female' && (name.includes('zira') || name.includes('female'))) { selectedVoice = v; break; }
                }
                utterance.voice = selectedVoice;
            }
            window.speechSynthesis.speak(utterance);
        }

        let model;
        let labels = [];
        let sequence = [];
        const FRAMES_PER_SEQUENCE = 30;
        let lastSpokenTime = 0;
        let lastSpokenWord = "";

        async function loadAI() {
            try {
                const labelsResponse = await fetch('./classes.json');
                if (!labelsResponse.ok) throw new Error("Δεν βρέθηκε το classes.json");
                labels = await labelsResponse.json();
                
                model = await tf.loadLayersModel('./model.json');
                
                statusBox.innerText = "✅ AI Έτοιμο!";
                statusBox.style.background = "rgba(0, 255, 0, 0.8)";
            } catch (error) {
                statusBox.innerText = "❌ Σφάλμα φόρτωσης";
                statusBox.style.background = "rgba(255, 0, 0, 0.8)";
            }
        }
        loadAI();

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({
            maxNumHands: 1, 
            modelComplexity: 1,
            minDetectionConfidence: 0.5, 
            minTrackingConfidence: 0.5   
        });

        hands.onResults((results) => {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            let currentTimeSec = performance.now() / 1000;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1});

                if (model && labels.length > 0) {
                    let flatLandmarks = [];
                    for (let i = 0; i < landmarks.length; i++) {
                        flatLandmarks.push(landmarks[i].x, landmarks[i].y, landmarks[i].z);
                    }
                    sequence.push(flatLandmarks);
                    if (sequence.length > FRAMES_PER_SEQUENCE) sequence.shift();

                    if (sequence.length === FRAMES_PER_SEQUENCE) {
                        try {
                            const inputTensor = tf.tensor2d([sequence.flat()]);
                            const prediction = model.predict(inputTensor);
                            const scores = prediction.dataSync();
                            const maxScoreIndex = scores.indexOf(Math.max(...scores));
                            const confidence = scores[maxScoreIndex];

                            let detectedWord = labels[maxScoreIndex];
                            
                            // Ανανέωση του ζωντανού ραντάρ στην οθόνη
                            liveRadar.innerText = "Σκέφτομαι: " + detectedWord + " (" + Math.round(confidence * 100) + "%)";

                            // Κατεβάσαμε το όριο στο 40% (0.40)
                            if (confidence > 0.40) { 
                                if (detectedWord !== lastSpokenWord || (currentTimeSec - lastSpokenTime) > 3.0) {
                                    speakGreek(detectedWord);
                                    lastSpokenWord = detectedWord;
                                    lastSpokenTime = currentTimeSec;
                                    
                                    finalWordBox.innerText = detectedWord;
                                    finalWordBox.style.display = 'block';
                                    setTimeout(() => { finalWordBox.style.display = 'none'; }, 2000);
                                    
                                    sequence = sequence.slice(15); 
                                }
                            }
                            tf.dispose([inputTensor, prediction]);
                        } catch (e) {}
                    }
                }
            } else {
                liveRadar.innerText = "Δεν βλέπω χέρια...";
            }
            canvasCtx.restore();
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480
        });
        camera.start();
    </script>
</body>
</html>
