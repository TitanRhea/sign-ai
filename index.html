<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignAI - Data Collector v1</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            position: relative;
            display: inline-block;
            margin-top: 10px;
            border: 4px solid #333;
            border-radius: 10px;
            overflow: hidden;
        }
        .recording-border {
            border-color: #ff3333 !important;
            box-shadow: 0 0 20px #ff3333;
        }
        video { display: none; }
        canvas { transform: scaleX(-1); background-color: #000; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; align-items: center; justify-content: center;
        }
        #rec-status {
            font-size: 60px; font-weight: bold; color: #ff3333;
            background: rgba(0,0,0,0.6); padding: 20px 40px; border-radius: 15px;
            display: none; text-shadow: 2px 2px 5px black;
        }
        
        .panel {
            margin-top: 20px; background: #1e1e1e; padding: 20px;
            border-radius: 10px; display: inline-block; border: 1px solid #444;
        }
        input[type="text"] {
            padding: 10px; font-size: 18px; border-radius: 5px;
            border: none; margin-right: 10px; width: 200px; text-transform: lowercase;
        }
        button {
            padding: 10px 20px; font-size: 18px; border-radius: 5px;
            border: none; cursor: pointer; font-weight: bold; color: white; margin: 0 5px;
        }
        #btn-rec { background-color: #f44336; }
        #btn-rec:hover { background-color: #d32f2f; }
        #btn-save { background-color: #4CAF50; }
        #btn-save:hover { background-color: #388E3C; }
        
        .stats { margin-top: 15px; font-size: 18px; color: #aaa; }
        .log-box { 
            margin-top: 20px; width: 600px; height: 100px; background: #000; 
            border: 1px solid #333; display: inline-block; text-align: left; 
            overflow-y: auto; padding: 10px; font-family: monospace; color: #0f0;
        }
    </style>
</head>
<body>

    <h1>🧠 SignAI: Εργαλείο Συλλογής Δεδομένων</h1>
    <p>Εκπαιδεύουμε το σύστημα! Διάλεξε λέξη και γράψε την κίνησή σου (30 καρέ τη φορά).</p>

    <div class="panel">
        <input type="text" id="label-input" placeholder="π.χ. καλημερα" value="καλημερα">
        <button id="btn-rec">🔴 Εγγραφή (Space)</button>
        <button id="btn-save">💾 Αποθήκευση Δεδομένων</button>
        <div class="stats">Συνολικά Δείγματα: <span id="sample-count" style="color:white; font-weight:bold;">0</span></div>
    </div><br>

    <div class="container" id="video-container">
        <video id="video_element" width="640" height="480" autoplay></video>
        <canvas id="canvas_element" width="640" height="480"></canvas>
        <div id="ui-layer">
            <div id="rec-status">REC (0/30)</div>
        </div>
    </div><br>

    <div class="log-box" id="log-console">Σύστημα Έτοιμο. Αναμονή για κάμερα...<br></div>

    <script>
        const videoElement = document.getElementById('video_element');
        const canvasElement = document.getElementById('canvas_element');
        const canvasCtx = canvasElement.getContext('2d');
        const recStatus = document.getElementById('rec-status');
        const videoContainer = document.getElementById('video-container');
        const labelInput = document.getElementById('label-input');
        const sampleCountText = document.getElementById('sample-count');
        const logConsole = document.getElementById('log-console');

        // --- ΜΕΤΑΒΛΗΤΕΣ ΚΑΤΑΓΡΑΦΗΣ ---
        let dataset = []; // Εδώ αποθηκεύονται όλα
        let isRecording = false;
        let currentSequence = [];
        const FRAMES_PER_SEQUENCE = 30; // Καταγράφουμε 30 καρέ ανά κίνηση

        function log(msg) {
            logConsole.innerHTML += msg + "<br>";
            logConsole.scrollTop = logConsole.scrollHeight;
        }

        // --- ΕΚΚΙΝΗΣΗ ΕΓΓΡΑΦΗΣ ---
        function startRecording() {
            if (isRecording) return;
            const label = labelInput.value.trim().toLowerCase();
            if (label === "") {
                alert("Γράψε μια λέξη πρώτα!");
                return;
            }

            log(`Προετοιμασία για: [${label}]...`);
            
            // Αντίστροφη μέτρηση 1 δευτερόλεπτο για να ετοιμαστείς
            setTimeout(() => {
                isRecording = true;
                currentSequence = [];
                videoContainer.classList.add("recording-border");
                recStatus.style.display = "block";
                log(`🔴 RECORDING ξεκίνησε! Κάνε την κίνηση.`);
            }, 1000);
        }

        document.getElementById('btn-rec').addEventListener('click', startRecording);
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && document.activeElement !== labelInput) {
                e.preventDefault();
                startRecording();
            }
        });

        // --- ΑΠΟΘΗΚΕΥΣΗ JSON ---
        document.getElementById('btn-save').addEventListener('click', () => {
            if (dataset.length === 0) {
                alert("Δεν υπάρχουν δεδομένα για αποθήκευση!");
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataset));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href",     dataStr);
            downloadAnchorNode.setAttribute("download", "sign_dataset.json");
            document.body.appendChild(downloadAnchorNode); 
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
            log(`💾 Αποθηκεύτηκαν ${dataset.length} δείγματα!`);
        });

        // --- RENDER MEDIAPIPE ---
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({
            maxNumHands: 1, // Για το AI, εστιάζουμε σε 1 χέρι για αρχή (το κυρίαρχο)
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults((results) => {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1});

                // Λογική Καταγραφής
                if (isRecording) {
                    // Μετατροπή 21 σημείων (x,y,z) σε έναν μονοδιάστατο πίνακα 63 αριθμών
                    let flatLandmarks = [];
                    for (let i = 0; i < landmarks.length; i++) {
                        flatLandmarks.push(landmarks[i].x, landmarks[i].y, landmarks[i].z);
                    }
                    
                    currentSequence.push(flatLandmarks);
                    recStatus.innerText = `REC (${currentSequence.length}/${FRAMES_PER_SEQUENCE})`;

                    // Όταν φτάσουμε τα 30 καρέ, σταματάμε την καταγραφή
                    if (currentSequence.length >= FRAMES_PER_SEQUENCE) {
                        isRecording = false;
                        videoContainer.classList.remove("recording-border");
                        recStatus.style.display = "none";
                        
                        // Αποθήκευση της κίνησης στο dataset
                        dataset.push({
                            label: labelInput.value.trim().toLowerCase(),
                            sequence: currentSequence
                        });
                        
                        sampleCountText.innerText = dataset.length;
                        log(`✅ Ολοκληρώθηκε 1 δείγμα για: [${labelInput.value}]`);
                    }
                }
            } else {
                if (isRecording) {
                    // Αν χαθεί το χέρι κατά την εγγραφή, δεν καταγράφουμε κενά δεδομένα.
                    recStatus.innerText = "ΧΑΘΗΚΕ ΤΟ ΧΕΡΙ!";
                }
            }
            canvasCtx.restore();
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480
        });
        camera.start().then(() => { log("Κάμερα ενεργή."); });
    </script>
</body>
</html>
