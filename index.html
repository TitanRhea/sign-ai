<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignAI - Mapping Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { position: relative; display: inline-block; border: 4px solid #FF9800; border-radius: 10px; overflow: hidden; }
        video { display: none; }
        canvas { transform: scaleX(-1); background-color: black; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; padding: 20px; box-sizing: border-box; }
        #number-display { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 120px; font-weight: bold; color: #00FF00; text-shadow: 0 0 20px #000; }
        #radar { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; font-size: 20px; color: #FF9800; border: 1px solid #FF9800; text-align: left; }
    </style>
</head>
<body>

    <h1>🔍 Test Χαρτογράφησης (1 Λεπτό)</h1>
    <p>Κάνε τις κινήσεις σου και δες ποιο <b>ΝΟΥΜΕΡΟ</b> εμφανίζεται στην οθόνη.</p>

    <div class="container">
        <video id="video_element" width="640" height="480" autoplay></video>
        <canvas id="canvas_element" width="640" height="480"></canvas>
        <div id="ui-layer">
            <div id="number-display">?</div>
            <div id="radar">Περιμένω κίνηση...</div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('video_element');
        const canvasElement = document.getElementById('canvas_element');
        const canvasCtx = canvasElement.getContext('2d');
        const numberDisplay = document.getElementById('number-display');
        const radar = document.getElementById('radar');

        let model;
        let sequence = [];
        const FRAMES_PER_SEQUENCE = 30;

        async function loadAI() {
            try {
                model = await tf.loadLayersModel('./model.json');
                console.log("Model Loaded");
            } catch (e) { console.error(e); }
        }
        loadAI();

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

        hands.onResults((results) => {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1});

                if (model) {
                    let flat = [];
                    for (let l of landmarks) flat.push(l.x, l.y, l.z);
                    sequence.push(flat);
                    if (sequence.length > FRAMES_PER_SEQUENCE) sequence.shift();

                    if (sequence.length === FRAMES_PER_SEQUENCE) {
                        const input = tf.tensor2d([sequence.flat()]);
                        const prediction = model.predict(input);
                        const scores = prediction.dataSync();
                        const maxIndex = scores.indexOf(Math.max(...scores));
                        const confidence = scores[maxIndex];

                        if (confidence > 0.40) {
                            const foundNumber = maxIndex + 1;
                            numberDisplay.innerText = foundNumber;
                            radar.innerText = "ΒΛΕΠΩ: Νούμερο " + foundNumber + " (" + Math.round(confidence*100) + "%)";
                        }
                        tf.dispose([input, prediction]);
                    }
                }
            } else { 
                numberDisplay.innerText = "?";
                radar.innerText = "Δεν βλέπω χέρι...";
            }
            canvasCtx.restore();
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480
        });
        camera.start();
    </script>
</body>
</html>
