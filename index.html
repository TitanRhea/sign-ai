<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignAI Web - Olga's Final</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { position: relative; display: inline-block; border: 4px solid #4CAF50; border-radius: 10px; overflow: hidden; }
        video { display: none; }
        canvas { transform: scaleX(-1); background-color: black; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; padding: 20px; box-sizing: border-box; }
        #final-word { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 255, 0, 0.9); color: black; padding: 20px 50px; font-size: 48px; font-weight: bold; border-radius: 15px; display: none; border: 3px solid white; }
        #status-box { position: absolute; top: 10px; left: 10px; background: rgba(255, 152, 0, 0.9); padding: 5px 12px; border-radius: 5px; font-size: 14px; color: black; font-weight: bold; }
        #live-radar { position: absolute; bottom: 10px; left: 10px; background: rgba(0, 0, 0, 0.8); padding: 12px; border-radius: 8px; font-size: 18px; color: #00FF00; border: 1px solid #4CAF50; }
    </style>
</head>
<body>

    <h1>🚀 SignAI: Olga's System</h1>
    <p>Κάνε τη χειρονομία. Πάτα <b>2</b> για Γυναίκα και <b>Κάνε Κλικ</b> στην κάμερα!</p>

    <div class="container" onclick="unlockAudio()">
        <video id="video_element" width="640" height="480" autoplay></video>
        <canvas id="canvas_element" width="640" height="480"></canvas>
        <div id="ui-layer">
            <div id="status-box">Φόρτωση...</div>
            <div id="final-word"></div>
            <div id="live-radar">Σύστημα: Αναμονή</div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('video_element');
        const canvasElement = document.getElementById('canvas_element');
        const canvasCtx = canvasElement.getContext('2d');
        const finalWordBox = document.getElementById('final-word');
        const statusBox = document.getElementById('status-box');
        const liveRadar = document.getElementById('live-radar');

        let preferredGender = 'female'; 
        let audioUnlocked = false;

        function unlockAudio() {
            audioUnlocked = true;
            statusBox.innerText = "🔊 Ήχος Ενεργός";
            setTimeout(() => { statusBox.innerText = "✅ AI ΕΤΟΙΜΟ"; }, 2000);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === '1') preferredGender = 'male';
            if (e.key === '2') preferredGender = 'female';
        });

        function speakGreek(text) {
            if (!audioUnlocked) return;
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'el-GR';
            
            let voices = window.speechSynthesis.getVoices();
            let greekVoices = voices.filter(v => v.lang.includes('el'));
            
            if (greekVoices.length > 0) {
                let selectedVoice = greekVoices[0];
                for (let v of greekVoices) {
                    let name = v.name.toLowerCase();
                    if (preferredGender === 'male' && name.includes('stefanos')) selectedVoice = v;
                    if (preferredGender === 'female' && (name.includes('google') || name.includes('athina') || name.includes('female') || name.includes('zira'))) {
                        selectedVoice = v;
                        break;
                    }
                }
                utterance.voice = selectedVoice;
            }
            window.speechSynthesis.speak(utterance);
        }

        let model, labels = [], sequence = [];
        const FRAMES_PER_SEQUENCE = 30;
        let lastSpokenTime = 0;

        async function init() {
            try {
                const res = await fetch('./classes.json');
                labels = await res.json();
                model = await tf.loadLayersModel('./model.json');
                statusBox.innerText = "✅ AI ΕΤΟΙΜΟ";
                statusBox.style.background = "#00FF00";
            } catch (e) { statusBox.innerText = "❌ ΣΦΑΛΜΑ ΑΡΧΕΙΩΝ"; }
        }
        init();

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

        hands.onResults((results) => {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            let now = performance.now() / 1000;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1});

                if (model && labels.length > 0) {
                    let flat = [];
                    for (let l of landmarks) flat.push(l.x, l.y, l.z);
                    sequence.push(flat);
                    if (sequence.length > FRAMES_PER_SEQUENCE) sequence.shift();

                    if (sequence.length === FRAMES_PER_SEQUENCE) {
                        const input = tf.tensor2d([sequence.flat()]);
                        const prediction = model.predict(input);
                        const scores = prediction.dataSync();
                        const maxIdx = scores.indexOf(Math.max(...scores));
                        const conf = scores[maxIdx];
                        let word = labels[maxIdx];
                        
                        liveRadar.innerText = `Ανάλυση: ${word} (${Math.round(conf*100)}%)`;

                        // ΟΡΙΟ ΣΤΟ 60% ΟΠΩΣ ΖΗΤΗΣΕΣ
                        if (conf > 0.60 && (now - lastSpokenTime) > 3) { 
                            speakGreek(word);
                            lastSpokenTime = now;
                            finalWordBox.innerText = word;
                            finalWordBox.style.display = 'block';
                            setTimeout(() => finalWordBox.style.display = 'none', 2000);
                            sequence = sequence.slice(15); 
                        }
                        tf.dispose([input, prediction]);
                    }
                }
            } else { liveRadar.innerText = "Αναμονή..."; }
            canvasCtx.restore();
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480
        });
        camera.start();
    </script>
</body>
</html>
