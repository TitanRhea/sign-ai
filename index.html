<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignAI Web - Στατικό Μεσημέρι & Κλειδωμένη Βάση</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            position: relative;
            display: inline-block;
            margin-top: 20px;
            border: 4px solid #4CAF50;
            border-radius: 10px;
            overflow: hidden;
        }
        video {
            display: none;
        }
        canvas {
            transform: scaleX(-1);
            background-color: black;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        #reading-box {
            align-self: flex-start;
            background: rgba(255, 0, 0, 0.7);
            padding: 10px 20px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 5px;
            display: none;
        }
        #final-word {
            align-self: center;
            background: rgba(0, 255, 0, 0.8);
            color: black;
            padding: 15px 40px;
            font-size: 32px;
            font-weight: bold;
            border-radius: 10px;
            text-transform: uppercase;
            display: none;
            margin-bottom: 20px;
        }
        h1 { margin-top: 0; color: #4CAF50; }
    </style>
</head>
<body>

    <h1>🚀 SignAI Web: Αμφίδρομη Επικοινωνία</h1>
    <p>Δείξε μια χειρονομία στην κάμερα. Το σύστημα θα μιλήσει στα Ελληνικά!</p>

    <div class="container">
        <video id="video_element" width="640" height="480" autoplay></video>
        <canvas id="canvas_element" width="640" height="480"></canvas>
        <div id="ui-layer">
            <div id="reading-box">READING: <span id="current-scan">...</span></div>
            <div id="final-word"></div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('video_element');
        const canvasElement = document.getElementById('canvas_element');
        const canvasCtx = canvasElement.getContext('2d');
        const readingBox = document.getElementById('reading-box');
        const currentScanText = document.getElementById('current-scan');
        const finalWordBox = document.getElementById('final-word');

        // --- ΜΕΤΑΒΛΗΤΕΣ ΛΟΓΙΚΗΣ ---
        let recording = false;
        let recording_started_at = 0;
        let word_candidates = [];
        let word_queue = [];
        let current_word = null;

        // --- ΣΥΣΤΗΜΑ ΗΧΟΥ (Web Speech API) ---
        function speakGreek(text) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'el-GR';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        // --- ΡΥΘΜΙΣΗ MEDIAPIPE ---
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        camera.start();

        // --- ΒΑΣΙΚΗ ΛΟΓΙΚΗ ΕΠΕΞΕΡΓΑΣΙΑΣ ΚΑΡΕ ---
        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            let active_now = null;
            let h_cnt = 0;
            
            // 100% ΠΙΣΤΗ ΑΝΤΙΓΡΑΦΗ ΑΠΟ ΤΟ PYTHON SCRIPT ΓΙΑ ΤΑ ΠΑΛΙΑ
            let palm = false, idx = false, moutza = false;
            let h_chin = false, h_high = false, h_chest = false;
            let y_index_tip = 1.0;
            let y_wrist = 1.0; 

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                h_cnt = results.multiHandLandmarks.length;

                for (const lm of results.multiHandLandmarks) {
                    drawConnectors(canvasCtx, lm, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 5});
                    drawLandmarks(canvasCtx, lm, {color: '#FF0000', lineWidth: 2});

                    y_wrist = lm[0].y;
                    
                    if (y_wrist < 0.40) h_chin = true;
                    else if (y_wrist < 0.65) h_high = true;
                    else h_chest = true;

                    let up = 0;
                    if (lm[8].y < lm[6].y) up++;
                    if (lm[12].y < lm[10].y) up++;
                    if (lm[16].y < lm[14].y) up++;
                    if (lm[20].y < lm[18].y) up++;

                    if (up >= 3) palm = true;
                    else if (up === 1) idx = true;

                    let dist_thumb_pinky = Math.hypot(lm[4].x - lm[20].x, lm[4].y - lm[20].y);
                    let dist_index_middle = Math.hypot(lm[8].x - lm[12].x, lm[8].y - lm[12].y);
                    
                    y_index_tip = lm[8].y;

                    if (palm && dist_thumb_pinky > 0.15 && dist_index_middle > 0.03) {
                        moutza = true;
                    }
                }
            }

            // --- ΙΕΡΑΡΧΙΑ ΚΑΝΟΝΩΝ ---
            
            // 1. ΚΑΛΟ ΜΕΣΗΜΕΡΙ: Αμετάβλητο
            if (h_cnt === 1 && y_index_tip < 0.45 && y_wrist > y_index_tip && palm && !moutza) {
                active_now = "καλό μεσημέρι";
            } 
            // 2. ΕΥΧΑΡΙΣΤΩ: Νέος κανόνας με τα δικά σου λόγια (Στήθος, παλάμη, σχετικά κλειστά δάχτυλα)
            else if (h_chest && palm && !moutza) {
                active_now = "ευχαριστώ";
            } 
            // 3. ΓΕΙΑ: Αμετάβλητο (Ανοιχτά δάχτυλα/μούτζα)
            else if (moutza) {
                active_now = "γεια";
            } 
            // 4. ΚΑΛΗΜΕΡΑ: Αμετάβλητο
            else if (idx && h_high) {
                active_now = "καλημέρα";
            } 
            // 5. ΟΝΟΜΑ: Αμετάβλητο
            else if (idx && h_chest) {
                active_now = "ποιο είναι το όνομά σου";
            }

            // --- ΣΥΣΤΗΜΑ RECORDING ---
            let currentTime = performance.now() / 1000;

            if (active_now) {
                if (!recording) {
                    console.log(`📡 [SCAN] Εντοπίστηκε: ${active_now}`);
                    recording = true;
                    recording_started_at = currentTime;
                    word_candidates = [active_now];
                    
                    readingBox.style.display = 'block';
                    currentScanText.innerText = active_now;
                } else {
                    word_candidates.push(active_now);
                    current_word = active_now;
                    currentScanText.innerText = current_word;
                }
            }

            if (recording) {
                if ((currentTime - recording_started_at) >= 1.4) {
                    if (word_candidates.length > 0) {
                        let counts = {};
                        let maxWord = word_candidates[0];
                        let maxCount = 0;
                        for (let w of word_candidates) {
                            counts[w] = (counts[w] || 0) + 1;
                            if (counts[w] > maxCount) {
                                maxCount = counts[w];
                                maxWord = w;
                            }
                        }

                        let final = maxWord;
                        word_queue.push(final);
                        
                        console.log(`✅ [FINAL] Ειπώθηκε: ${final}`);
                        speakGreek(final);

                        finalWordBox.innerText = final;
                        finalWordBox.style.display = 'block';
                        
                        setTimeout(() => {
                            finalWordBox.style.display = 'none';
                        }, 2000);
                    }
                    recording = false;
                    current_word = null;
                    readingBox.style.display = 'none';
                }
            } else {
                readingBox.style.display = 'none';
            }

            canvasCtx.restore();
        }
    </script>
</body>
</html>
