<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignAI Web - Στατικό Μεσημέρι & Απόλυτη Ακρίβεια</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            position: relative;
            display: inline-block;
            margin-top: 20px;
            border: 4px solid #4CAF50;
            border-radius: 10px;
            overflow: hidden;
        }
        video {
            display: none;
        }
        canvas {
            transform: scaleX(-1);
            background-color: black;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        #reading-box {
            align-self: flex-start;
            background: rgba(255, 0, 0, 0.7);
            padding: 10px 20px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 5px;
            display: none;
        }
        #final-word {
            align-self: center;
            background: rgba(0, 255, 0, 0.8);
            color: black;
            padding: 15px 40px;
            font-size: 32px;
            font-weight: bold;
            border-radius: 10px;
            text-transform: uppercase;
            display: none;
            margin-bottom: 20px;
        }
        h1 { margin-top: 0; color: #4CAF50; }
    </style>
</head>
<body>

    <h1>🚀 SignAI Web: Αμφίδρομη Επικοινωνία</h1>
    <p>Δείξε μια χειρονομία στην κάμερα. Το σύστημα θα μιλήσει στα Ελληνικά!</p>

    <div class="container">
        <video id="video_element" width="640" height="480" autoplay></video>
        <canvas id="canvas_element" width="640" height="480"></canvas>
        <div id="ui-layer">
            <div id="reading-box">READING: <span id="current-scan">...</span></div>
            <div id="final-word"></div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('video_element');
        const canvasElement = document.getElementById('canvas_element');
        const canvasCtx = canvasElement.getContext('2d');
        const readingBox = document.getElementById('reading-box');
        const currentScanText = document.getElementById('current-scan');
        const finalWordBox = document.getElementById('final-word');

        // --- ΜΕΤΑΒΛΗΤΕΣ ΛΟΓΙΚΗΣ ---
        let recording = false;
        let recording_started_at = 0;
        let word_candidates = [];
        let word_queue = [];
        let current_word = null;

        // --- ΣΥΣΤΗΜΑ ΗΧΟΥ (Web Speech API) ---
        function speakGreek(text) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'el-GR';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        // --- ΡΥΘΜΙΣΗ MEDIAPIPE ---
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.6, // Ελαφρώς χαμηλωμένο για να μην χάνει το χέρι
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        camera.start();

        // --- ΒΑΣΙΚΗ ΛΟΓΙΚΗ ΕΠΕΞΕΡΓΑΣΙΑΣ ΚΑΡΕ ---
        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            let active_now = null;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                // Αναλύουμε το πρώτο χέρι που βλέπει για να μην μπερδεύεται
                const lm = results.multiHandLandmarks[0];
                
                drawConnectors(canvasCtx, lm, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 5});
                drawLandmarks(canvasCtx, lm, {color: '#FF0000', lineWidth: 2});

                // Υπολογισμός δαχτύλων (Ποια είναι πάνω)
                let is_index_up = lm[8].y < lm[6].y;
                let is_middle_up = lm[12].y < lm[10].y;
                let is_ring_up = lm[16].y < lm[14].y;
                let is_pinky_up = lm[20].y < lm[18].y;

                let up_count = 0;
                if (is_index_up) up_count++;
                if (is_middle_up) up_count++;
                if (is_ring_up) up_count++;
                if (is_pinky_up) up_count++;

                // Αποστάσεις για να δούμε αν είναι ανοιχτά ή κολλημένα
                let dist_index_middle = Math.hypot(lm[8].x - lm[12].x, lm[8].y - lm[12].y);
                let y_wrist = lm[0].y;

                // --- ΝΕΑ ΑΠΟΛΥΤΗ ΙΕΡΑΡΧΙΑ ΚΑΝΟΝΩΝ ---
                
                // ΠΕΡΙΠΤΩΣΗ 1: Ανοιχτή παλάμη (3 ή 4 δάχτυλα πάνω)
                if (up_count >= 3) {
                    if (dist_index_middle > 0.05) { 
                        // Δάχτυλα ανοιχτά/απλωμένα
                        active_now = "γεια"; 
                    } else { 
                        // Δάχτυλα κολλημένα μεταξύ τους (σαν σπάτουλα)
                        if (y_wrist < 0.60) {
                            active_now = "καλό μεσημέρι"; // Αν το χέρι είναι ψηλά
                        } else {
                            active_now = "ευχαριστώ";     // Αν το χέρι είναι χαμηλά (στήθος/στομάχι)
                        }
                    }
                } 
                // ΠΕΡΙΠΤΩΣΗ 2: Μόνο Δείκτης Ή Δείκτης + Μεσαίος (1 ή 2 δάχτυλα)
                else if (is_index_up && !is_ring_up && !is_pinky_up) {
                    if (is_middle_up) {
                        // Αν δείχνει και ο δείκτης και ο μεσαίος (Σχήμα V ή U)
                        active_now = "ποιο είναι το όνομά σου";
                    } else {
                        // Αν δείχνει ΜΟΝΟ ο δείκτης
                        if (y_wrist < 0.60) {
                            active_now = "καλημέρα";               // Αν είναι ψηλά (πρόσωπο/ώμος)
                        } else {
                            active_now = "ποιο είναι το όνομά σου"; // Αν είναι χαμηλά (στήθος)
                        }
                    }
                }
            }

            // --- ΣΥΣΤΗΜΑ RECORDING ---
            let currentTime = performance.now() / 1000;

            if (active_now) {
                if (!recording) {
                    console.log(`📡 [SCAN] Εντοπίστηκε: ${active_now}`);
                    recording = true;
                    recording_started_at = currentTime;
                    word_candidates = [active_now];
                    
                    readingBox.style.display = 'block';
                    currentScanText.innerText = active_now;
                } else {
                    word_candidates.push(active_now);
                    current_word = active_now;
                    currentScanText.innerText = current_word;
                }
            }

            if (recording) {
                // ΜΕΙΩΣΑΜΕ ΤΟΝ ΧΡΟΝΟ ΣΤΑ 0.8 SECONDS ΓΙΑ ΑΣΤΡΑΠΙΑΙΑ ΑΝΤΙΔΡΑΣΗ
                if ((currentTime - recording_started_at) >= 0.8) {
                    if (word_candidates.length > 0) {
                        let counts = {};
                        let maxWord = word_candidates[0];
                        let maxCount = 0;
                        for (let w of word_candidates) {
                            counts[w] = (counts[w] || 0) + 1;
                            if (counts[w] > maxCount) {
                                maxCount = counts[w];
                                maxWord = w;
                            }
                        }

                        let final = maxWord;
                        word_queue.push(final);
                        
                        console.log(`✅ [FINAL] Ειπώθηκε: ${final}`);
                        speakGreek(final);

                        finalWordBox.innerText = final;
                        finalWordBox.style.display = 'block';
                        
                        setTimeout(() => {
                            finalWordBox.style.display = 'none';
                        }, 2000);
                    }
                    recording = false;
                    current_word = null;
                    readingBox.style.display = 'none';
                }
            } else {
                readingBox.style.display = 'none';
            }

            canvasCtx.restore();
        }
    </script>
</body>
</html>
