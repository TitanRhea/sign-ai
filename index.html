<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignAI Web - AI Powered</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { position: relative; display: inline-block; margin-top: 20px; border: 4px solid #4CAF50; border-radius: 10px; overflow: hidden; }
        video { display: none; }
        canvas { transform: scaleX(-1); background-color: black; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        #final-word { align-self: center; background: rgba(0, 255, 0, 0.8); color: black; padding: 15px 40px; font-size: 36px; font-weight: bold; border-radius: 10px; text-transform: uppercase; display: none; margin-bottom: 20px; text-shadow: 1px 1px 2px rgba(255,255,255,0.5); }
        #voice-indicator { position: absolute; top: 10px; right: 10px; background: rgba(33, 150, 243, 0.8); padding: 5px 10px; border-radius: 5px; font-size: 14px; font-weight: bold; }
        #status-box { position: absolute; top: 10px; left: 10px; background: rgba(255, 152, 0, 0.8); padding: 5px 10px; border-radius: 5px; font-size: 14px; font-weight: bold; color: black;}
        h1 { margin-top: 0; color: #4CAF50; }
    </style>
</head>
<body>

    <h1>🚀 SignAI: Τεχνητή Νοημοσύνη</h1>
    <p>Δείξε μια χειρονομία στην κάμερα. Πάτα <b>1</b> για Άντρα ή <b>2</b> για Γυναίκα.</p>

    <div class="container">
        <video id="video_element" width="640" height="480" autoplay></video>
        <canvas id="canvas_element" width="640" height="480"></canvas>
        <div id="ui-layer">
            <div id="status-box">Φόρτωση AI...</div>
            <div id="voice-indicator">Φωνή: Γυναίκα (Προεπιλογή)</div>
            <div id="final-word"></div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('video_element');
        const canvasElement = document.getElementById('canvas_element');
        const canvasCtx = canvasElement.getContext('2d');
        const finalWordBox = document.getElementById('final-word');
        const voiceIndicator = document.getElementById('voice-indicator');
        const statusBox = document.getElementById('status-box');

        // --- ΕΠΙΛΟΓΗ ΦΩΝΗΣ ---
        let preferredGender = 'female'; 
        window.addEventListener('keydown', (e) => {
            if (e.key === '1') {
                preferredGender = 'male';
                voiceIndicator.innerText = "Φωνή: Άντρας";
            } else if (e.key === '2') {
                preferredGender = 'female';
                voiceIndicator.innerText = "Φωνή: Γυναίκα";
            }
        });

        function speakGreek(text) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'el-GR';
            utterance.rate = 1.0;

            let voices = window.speechSynthesis.getVoices().filter(v => v.lang.includes('el'));
            if (voices.length > 0) {
                let selectedVoice = voices[0]; 
                for (let v of voices) {
                    let name = v.name.toLowerCase();
                    if (preferredGender === 'male' && (name.includes('stefanos') || name.includes('male'))) {
                        selectedVoice = v; break;
                    } else if (preferredGender === 'female' && (name.includes('zira') || name.includes('female'))) {
                        selectedVoice = v; break;
                    }
                }
                if (preferredGender === 'male' && voices.length > 1 && !selectedVoice.name.toLowerCase().includes('stefanos')) {
                    selectedVoice = voices[1]; 
                }
                utterance.voice = selectedVoice;
            }
            window.speechSynthesis.speak(utterance);
        }
        window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };

        // --- AI ΜΕΤΑΒΛΗΤΕΣ ---
        let model;
        let labels = [];
        let sequence = [];
        const FRAMES_PER_SEQUENCE = 30; // Περιμένει 30 καρέ κίνησης (περίπου 1 δευτερόλεπτο)
        let lastSpokenTime = 0;
        let lastSpokenWord = "";

        // Φόρτωση του Μοντέλου και του Λεξικού (ΕΔΩ ΕΙΝΑΙ ΤΟ ΜΥΣΤΙΚΟ ΓΙΑ ΤΟΝ ΦΑΚΕΛΟ)
        async function loadAI() {
            try {
                // Ψάχνει το αρχείο classes.json μέσα στον φάκελο model
                const labelsResponse = await fetch('./model/classes.json');
                labels = await labelsResponse.json();
                
                // Ψάχνει το αρχείο model.json μέσα στον φάκελο model
                model = await tf.loadLayersModel('./model/model.json');
                
                statusBox.innerText = "✅ AI Έτοιμο!";
                statusBox.style.background = "rgba(0, 255, 0, 0.8)";
                console.log("Το μοντέλο φορτώθηκε με επιτυχία!");
            } catch (error) {
                statusBox.innerText = "❌ Σφάλμα φόρτωσης";
                statusBox.style.background = "rgba(255, 0, 0, 0.8)";
                console.error("Σφάλμα:", error);
            }
        }
        loadAI();

        // --- RENDER MEDIAPIPE ---
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        
        // Ίδιες ρυθμίσεις με το εργαλείο καταγραφής
        hands.setOptions({
            maxNumHands: 1, 
            modelComplexity: 1,
            minDetectionConfidence: 0.5, 
            minTrackingConfidence: 0.5   
        });

        hands.onResults((results) => {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            let currentTimeSec = performance.now() / 1000;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1});

                if (model && labels.length > 0) {
                    // 1. Μετατροπή landmarks σε flat array (όπως στην Python)
                    let flatLandmarks = [];
                    for (let i = 0; i < landmarks.length; i++) {
                        flatLandmarks.push(landmarks[i].x, landmarks[i].y, landmarks[i].z);
                    }
                    
                    // 2. Προσθήκη στην "ουρά" της μνήμης
                    sequence.push(flatLandmarks);
                    if (sequence.length > FRAMES_PER_SEQUENCE) {
                        sequence.shift(); // Πετάμε το παλιότερο, κρατάμε μόνο τα τελευταία 30
                    }

                    // 3. Πρόβλεψη όταν μαζευτούν 30 καρέ
                    if (sequence.length === FRAMES_PER_SEQUENCE) {
                        let inputArray = sequence.flat();
                        
                        // Το ταΐζουμε στο AI
                        const inputTensor = tf.tensor2d([inputArray]);
                        const prediction = model.predict(inputTensor);
                        const scores = prediction.dataSync();
                        
                        // Βρίσκουμε ποια λέξη έχει το μεγαλύτερο σκορ
                        const maxScoreIndex = scores.indexOf(Math.max(...scores));
                        const confidence = scores[maxScoreIndex];

                        // Αν το AI είναι πάνω από 90% σίγουρο ΚΑΙ έχουν περάσει 3 δευτερόλεπτα από το προηγούμενο
                        if (confidence > 0.90) {
                            let detectedWord = labels[maxScoreIndex];
                            
                            if (detectedWord !== lastSpokenWord || (currentTimeSec - lastSpokenTime) > 3.0) {
                                console.log(`✅ ${detectedWord} (${Math.round(confidence * 100)}%)`);
                                speakGreek(detectedWord);
                                
                                lastSpokenWord = detectedWord;
                                lastSpokenTime = currentTimeSec;
                                
                                finalWordBox.innerText = detectedWord;
                                finalWordBox.style.display = 'block';
                                setTimeout(() => { finalWordBox.style.display = 'none'; }, 2000);
                                
                                // Αδειάζουμε την ουρά για να μην επαναλαμβάνει τη λέξη αμέσως
                                sequence = []; 
                            }
                        }
                        // Καθαρισμός μνήμης για να μην "κολλήσει" ο browser
                        tf.dispose([inputTensor, prediction]);
                    }
                }
            } else {
                // Αν χαθεί το χέρι από την κάμερα, μηδενίζουμε την κίνηση
                sequence = [];
            }
            canvasCtx.restore();
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480
        });
        camera.start();
    </script>
</body>
</html>
