<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignAI Web - Perfect Flow & Memory Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            position: relative;
            display: inline-block;
            margin-top: 20px;
            border: 4px solid #4CAF50;
            border-radius: 10px;
            overflow: hidden;
        }
        video {
            display: none;
        }
        canvas {
            transform: scaleX(-1);
            background-color: black;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        #reading-box {
            align-self: flex-start;
            background: rgba(255, 0, 0, 0.7);
            padding: 10px 20px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 5px;
            display: none;
        }
        #final-word {
            align-self: center;
            background: rgba(0, 255, 0, 0.8);
            color: black;
            padding: 15px 40px;
            font-size: 32px;
            font-weight: bold;
            border-radius: 10px;
            text-transform: uppercase;
            display: none;
            margin-bottom: 20px;
        }
        h1 { margin-top: 0; color: #4CAF50; }
    </style>
</head>
<body>

    <h1>🚀 SignAI Web: Αμφίδρομη Επικοινωνία</h1>
    <p>Δείξε μια χειρονομία στην κάμερα. Το σύστημα θα μιλήσει στα Ελληνικά!</p>

    <div class="container">
        <video id="video_element" width="640" height="480" autoplay></video>
        <canvas id="canvas_element" width="640" height="480"></canvas>
        <div id="ui-layer">
            <div id="reading-box">READING: <span id="current-scan">...</span></div>
            <div id="final-word"></div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('video_element');
        const canvasElement = document.getElementById('canvas_element');
        const canvasCtx = canvasElement.getContext('2d');
        const readingBox = document.getElementById('reading-box');
        const currentScanText = document.getElementById('current-scan');
        const finalWordBox = document.getElementById('final-word');

        // --- ΜΕΤΑΒΛΗΤΕΣ ΛΟΓΙΚΗΣ & ΜΝΗΜΗΣ ---
        let recording = false;
        let recording_started_at = 0;
        let word_candidates = [];
        let word_queue = [];
        let current_word = null;

        // Μνήμη για τις κινήσεις 2 σταδίων
        let step_onoma_1_time = 0;
        let step_efcharisto_1_time = 0;

        // --- ΣΥΣΤΗΜΑ ΗΧΟΥ (Web Speech API) ---
        function speakGreek(text) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'el-GR';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        // --- ΡΥΘΜΙΣΗ MEDIAPIPE ---
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        camera.start();

        // --- ΒΑΣΙΚΗ ΛΟΓΙΚΗ ΕΠΕΞΕΡΓΑΣΙΑΣ ΚΑΡΕ ---
        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            let active_now = null;
            let currentTimeSec = performance.now() / 1000;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                // Επεξεργαζόμαστε το πρώτο χέρι
                const lm = results.multiHandLandmarks[0];
                
                drawConnectors(canvasCtx, lm, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 5});
                drawLandmarks(canvasCtx, lm, {color: '#FF0000', lineWidth: 2});

                // Υψομετρικές ζώνες
                let y_wrist = lm[0].y;
                let h_chin = y_wrist < 0.50;  // Πηγούνι/Πρόσωπο
                let h_high = y_wrist < 0.75; 
                let h_chest = y_wrist >= 0.50; // Στήθος και κάτω

                // Μετρητής ανοιχτών δαχτύλων
                let is_index_up = lm[8].y < lm[6].y;
                let is_middle_up = lm[12].y < lm[10].y;
                let is_ring_up = lm[16].y < lm[14].y;
                let is_pinky_up = lm[20].y < lm[18].y;

                let up_count = 0;
                if(is_index_up) up_count++;
                if(is_middle_up) up_count++;
                if(is_ring_up) up_count++;
                if(is_pinky_up) up_count++;

                let palm = (up_count >= 3);
                let idx = (up_count === 1 && is_index_up);

                // Απόσταση δείκτη-μεσαίου (Διαχωρίζει σπάτουλα από απλωμένα δάχτυλα)
                let dist_index_middle = Math.hypot(lm[8].x - lm[12].x, lm[8].y - lm[12].y);
                let fingers_spread = dist_index_middle > 0.05;
                let fingers_together = dist_index_middle <= 0.05;

                // Απόσταση αντίχειρα-δείκτη (Διαχωρίζει τα "κυκλάκια" / ενωμένες άκρες)
                let thumb_index_dist = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
                let is_circle = thumb_index_dist < 0.06;

                // Δείξιμο ευθεία στην κάμερα (Βάθος Z)
                let pointing_forward = (idx && lm[8].z < -0.05);

                // --- 1. ΚΑΤΑΓΡΑΦΗ ΜΝΗΜΗΣ ΣΤΑΔΙΩΝ (ΤRANSITIONS) ---
                if (pointing_forward) {
                    step_onoma_1_time = currentTimeSec;
                }
                
                if (palm && fingers_together && h_chest) {
                    step_efcharisto_1_time = currentTimeSec;
                }

                // --- 2. ΑΠΟΛΥΤΗ ΙΕΡΑΡΧΙΑ ΚΑΝΟΝΩΝ (Βάσει φωτογραφιών) ---

                // ΟΝΟΜΑ: Είδαμε δείξιμο τα τελευταία 3 δευτερόλεπτα ΚΑΙ τώρα βλέπουμε κυκλάκια
                if (is_circle && (currentTimeSec - step_onoma_1_time < 3.0)) {
                    active_now = "ποιο είναι το όνομά σου";
                }
                // ΕΥΧΑΡΙΣΤΩ: Είτε κάνουμε το Στάδιο 1 (Στήθος), είτε το Στάδιο 2 (Ενωμένα) αμέσως μετά
                else if ((palm && fingers_together && h_chest) || (is_circle && (currentTimeSec - step_efcharisto_1_time < 3.0))) {
                    active_now = "ευχαριστώ";
                }
                // ΚΑΛΟ ΜΕΣΗΜΕΡΙ: Αποκλειστικά κλειστή παλάμη ψηλά στο πηγούνι/πρόσωπο
                else if (palm && fingers_together && h_chin) {
                    active_now = "καλό μεσημέρι";
                }
                // ΓΕΙΑ: Παλάμη με ανοιχτά/απλωμένα δάχτυλα
                else if (palm && fingers_spread) {
                    active_now = "γεια";
                }
                // ΚΑΛΗΜΕΡΑ: Δείκτης ψηλά, και ΟΧΙ προς την κάμερα (για να μην μπερδευτεί)
                else if (idx && !pointing_forward && h_high) {
                    active_now = "καλημέρα";
                }
            }

            // --- ΣΥΣΤΗΜΑ RECORDING ---
            if (active_now) {
                if (!recording) {
                    console.log(`📡 [SCAN] Εντοπίστηκε: ${active_now}`);
                    recording = true;
                    recording_started_at = currentTimeSec;
                    word_candidates = [active_now];
                    
                    readingBox.style.display = 'block';
                    currentScanText.innerText = active_now;
                } else {
                    word_candidates.push(active_now);
                    current_word = active_now;
                    currentScanText.innerText = current_word;
                }
            }

            if (recording) {
                if ((currentTimeSec - recording_started_at) >= 0.8) {
                    if (word_candidates.length > 0) {
                        let counts = {};
                        let maxWord = word_candidates[0];
                        let maxCount = 0;
                        for (let w of word_candidates) {
                            counts[w] = (counts[w] || 0) + 1;
                            if (counts[w] > maxCount) {
                                maxCount = counts[w];
                                maxWord = w;
                            }
                        }

                        let final = maxWord;
                        word_queue.push(final);
                        
                        console.log(`✅ [FINAL] Ειπώθηκε: ${final}`);
                        speakGreek(final);

                        finalWordBox.innerText = final;
                        finalWordBox.style.display = 'block';
                        
                        setTimeout(() => {
                            finalWordBox.style.display = 'none';
                        }, 2000);
                    }
                    recording = false;
                    current_word = null;
                    readingBox.style.display = 'none';
                }
            } else {
                readingBox.style.display = 'none';
            }

            canvasCtx.restore();
        }
    </script>
</body>
</html>
